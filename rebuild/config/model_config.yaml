# Model config for the rebuild's two call targets. Everything a caller
# needs to know about DeepSeek/agy lives here, not hardcoded in scripts --
# see feedback_everything_configurable_no_hardcoding memory. Change a
# model/endpoint/effort here, not in code.

deepseek:
  provider: deepseek
  endpoint: "https://api.deepseek.com"
  api_key_secret: deepseek_api_key   # key name in config/secrets.enc.yaml
  model: "deepseek-v4-pro"
  # Thinking-mode control (api-docs.deepseek.com/guides/thinking_mode/):
  # nested "thinking" object in the chat-completions request body --
  # type: enabled|disabled, reasoning_effort: none|low|high|max (only
  # meaningful when type is enabled). Disabled here per 2026-09-12 decision.
  thinking:
    type: "disabled"
  # DeepSeek peak billing (api-docs.deepseek.com/quick_start/pricing, verified
  # 2026-09-29): 01:00-04:00 and 06:00-10:00 UTC, Monday-Friday, excluding Chinese
  # public holidays; every other hour, weekends, and holidays are off-peak.
  # call_deepseek.py falls back to the OpenRouter free model below instead of
  # calling DeepSeek during peak. Windows are [start_hour, end_hour) UTC.
  peak_hours_utc: [[1, 4], [6, 10]]
  # Chinese statutory holiday rest days (Beijing calendar dates, State Council
  # General Office notice of 2025-11-04). Weekday dates listed here are off-peak.
  # Make-up workdays fall on weekends, so they are already off-peak. DeepSeek
  # publishes no list: refresh each November when the next year's notice issues;
  # dates missing from the list are treated as ordinary weekdays.
  # Auto-refresh source (NateScarlet/holiday-cn, MIT): daily scrape of the State
  # Council notice; a year file is only trusted when its "papers" list is non-empty.
  # refresh_if_stale() fetches into config/china_holidays.json (generated, untracked).
  holiday_source_url_template: "https://raw.githubusercontent.com/NateScarlet/holiday-cn/master/{year}.json"
  china_holiday_dates:
    - "2026-01-01"
    - "2026-01-02"
    - "2026-01-03"
    - "2026-02-15"
    - "2026-02-16"
    - "2026-02-17"
    - "2026-02-18"
    - "2026-02-19"
    - "2026-02-20"
    - "2026-02-21"
    - "2026-02-22"
    - "2026-02-23"
    - "2026-04-04"
    - "2026-04-05"
    - "2026-04-06"
    - "2026-05-01"
    - "2026-05-02"
    - "2026-05-03"
    - "2026-05-04"
    - "2026-05-05"
    - "2026-06-19"
    - "2026-06-20"
    - "2026-06-21"
    - "2026-09-25"
    - "2026-09-26"
    - "2026-09-27"
    - "2026-10-01"
    - "2026-10-02"
    - "2026-10-03"
    - "2026-10-04"
    - "2026-10-05"
    - "2026-10-06"
    - "2026-10-07"
  # Hard cap on cumulative logged spend (rebuild/logs/cost_log.jsonl). Over
  # this, call_deepseek.py refuses the call before it happens -- no bypass flag.
  spend_limit_usd: 5.0

openrouter:
  provider: openrouter
  endpoint: "https://openrouter.ai/api/v1"
  api_key_secret: open_router_api_key   # key name in config/secrets.enc.yaml
  # Peak-hours-only fallback for call_deepseek.py -- not a general DeepSeek
  # peer (see AGENTS.md). Free tier: shares the account's one 20 RPM/1000 RPD
  # OpenRouter pool across all models, so keep this to the narrow peak window.
  fallback_model: "nvidia/nemotron-3-ultra-550b-a55b:free"

# Standing Planner role (promoted from a one-off trial) that drafts task
# breakdowns for Claude to review/correct before dispatching to DeepSeek/agy.
# Claude remains the hub -- planner output never goes straight to a worker.
# Shares the same OpenRouter free-tier rate-limit pool (20 RPM/1000 RPD) as
# call_deepseek.py's peak-hours fallback above, so heavy planner use can
# starve that fallback and vice versa.
planner:
  provider: openrouter
  endpoint: "https://openrouter.ai/api/v1"
  api_key_secret: open_router_api_key
  model: "nvidia/nemotron-3-ultra-550b-a55b:free"

agy:
  # Local CLI, no API key. --dangerously-skip-permissions --mode plan are
  # always set by call_agy.py (mandatory, not configurable): without
  # --mode plan, agy is a fully agentic CLI that can write the target repo
  # directly instead of returning text for review -- see llm_client.py's
  # _call_agy_cli docstring in the old pipeline for the incident this
  # guards against.
  #
  # Pinned explicitly (2026-09-07, was null/agy's-own-default): agy's
  # default model lives in ~/.gemini/antigravity-cli/settings.json, a file
  # TriAPI doesn't own and shares with other projects (ECE111, oh-my-llama,
  # SemAI) -- a change there for an unrelated project would silently
  # change TriAPI's docs-tier model too, with nothing in this repo
  # recording it. Pinning here makes that explicit and immune to drift.
  model: "gemini-3.8-flash-medium"
  effort: "medium"

# Subprocess timeouts (seconds).
timeouts:
  http: 600
  agy_cli: 600
