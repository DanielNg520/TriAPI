# Single source of truth for the 4-tier pipeline. Scripts read this instead
# of hardcoding model names, endpoints, or escalation thresholds.

tier_1_planner:
  provider: openrouter
  api_key_secret: open_router_api_key
  name: "OpenRouter"
  endpoint: "https://openrouter.ai/api/v1"
  models:
    default: "stealth/ox-alpha"
  default_model: "default"
  role: "strategic planning"
  automatable: true
  outputs: ["PLAN.md", "ARCHITECTURE.md"]

tier_1_manager:
  enabled: true
  provider: "cli"
  models:
    default: "claude-code"
  default_model: "default"

tier_2_manager:
  provider: openrouter
  api_key_secret: open_router_api_key
  name: "OpenRouter Nemotron"
  # The Antigravity 2.0 desktop app is a GUI with no headless mode and stays
  # available as a manual review surface, but automated escalation calls the
  # underlying Gemini model directly via the Google AI Studio REST API --
  # not through the desktop app.
  endpoint: "https://openrouter.ai/api/v1"
  models:
    default: "nvidia/nemotron-3-ultra-550b-a55b:free"
    flash: "gemini-3.5-flash"
    pro: "gemini-2.5-pro"
  default_model: default
  # Tried in order whenever the current model's free-tier quota is
  # exhausted for the day -- confirmed live 2026-08-10 that Google buckets
  # this per model (error body: quotaId
  # "GenerateRequestsPerDayPerProjectPerModel-FreeTier", quotaValue 20 for
  # gemini-3.5-flash specifically), so a different model has its own
  # separate, unexhausted allowance. Per user direction: falls DOWN to
  # older/lighter models, never up to a newer one -- a newer model (e.g.
  # gemini-3.6-flash, version-wise above the default) is left for a
  # deliberate manual choice, not silently substituted by this reactive
  # chain. List verified against the real available models (GET
  # /v1beta/models) on 2026-08-10, flash-tier only (no -preview/-image/-tts
  # variants, no "-latest" aliases since their underlying quota bucket is
  # ambiguous).
  fallback_chain:
    - "gemini-3.5-flash"
    - "gemini-3.1-flash-lite"
    - "gemini-2.5-flash"
    - "gemini-2.5-flash-lite"
  role: "task orchestration, context isolation, high-level architectural correction"
  automatable: true
  pricing:
    # NOT free tier: user confirmed 2026-08-19 the Cloud project behind this
    # API key is billing-enabled ($10/mo recurring credit + $300 intro
    # credit), which per Google's rate-limit system means this project
    # auto-qualifies for at least Tier 1 paid limits, not the Free tier
    # these values previously assumed. Verified externally: Gemini 2.5 Pro
    # on Tier 1 paid is 150 RPM with no daily (RPD) cap. Could NOT
    # independently verify the exact figure for the flash models this repo
    # actually calls (gemini-3.5-flash / fallback_chain) -- flash limits are
    # typically equal to or higher than Pro's, so free_tier_rpm/rpd below
    # are raised to a deliberately conservative floor, not the real ceiling.
    # budget_guard.py treats these as a hard cap -- re-verify the exact
    # per-model Tier 1 numbers at https://ai.google.dev/gemini-api/docs/rate-limits
    # (or Google AI Studio's own per-key display) before loosening further.
    last_verified: "2026-08-19"
    free_tier_rpm: 60
    free_tier_rpd: 1500
    notes: "billing-enabled Tier 1+ paid project (confirmed 2026-08-19); RPM/RPD below are a conservative floor, not independently verified for the specific flash models used here -- see comment above"

gemini_fallback:
  endpoint: "https://generativelanguage.googleapis.com"
  models:
    flash: "gemini-3.5-flash"
  api_key_secret: google_ai_studio_api_key

tier_3_debugger:
  provider: openrouter
  api_key_secret: open_router_api_key
  name: "OpenRouter Dots"
  endpoint: "https://openrouter.ai/api/v1"
  models:
    default: "dots-studio/dots-3-note-preview:free"
  default_model: default
  role: "complex C++ logic, hard SIMD fixes, algorithmic diffs"
  automatable: true
  peak_hours_utc:
    # DeepSeek V4 pricing (effective 2026-08-16T16:00 UTC): 2x cost during
    # these UTC windows (verified by hand against America/Los_Angeles
    # PDT/PST wall-clock; see budget_guard.check_tier3_peak_hours_ok(),
    # which reads this list instead of hardcoding the windows).
    - ["01:00", "04:00"]
    - ["06:00", "10:00"]
  pricing:
    # Verify against DeepSeek's live pricing page periodically -- these
    # numbers WILL drift. Cost logging stores raw token counts precisely
    # so historical cost can be recomputed if this block goes stale.
    last_verified: "2026-08-09"
    flash:
      cache_miss_per_mtok_usd: 0.14
      cache_hit_per_mtok_usd: 0.0028
      output_per_mtok_usd: null   # not given in source doc -- verify before relying on it
    pro:
      cache_miss_per_mtok_usd: null  # not given in source doc -- verify before relying on it
      cache_hit_per_mtok_usd: 0.003625
      output_per_mtok_usd: null      # not given in source doc -- verify before relying on it
    default:
      cache_miss_per_mtok_usd: 0.0
      cache_hit_per_mtok_usd: 0.0
      output_per_mtok_usd: 0.0

tier_4_worker:
  provider: ollama
  api_key_secret: null
  name: "Local Ollama"
  endpoint: "http://localhost:11434"
  models:
    default: "qwen2.5-coder:14b-instruct-q8_0"
    polyglot: "deepseek-coder-v2:16b"
    heavy: "qwen2.5-coder:32b"
  default_model: default
  role: "high-volume code drafting, cmake/g++ compilation loops"
  # Local Ollama is not guaranteed to be running (build/verification fails
  # with connection refused on localhost:11434), so don't auto-dispatch to
  # this tier by default; callers that know Ollama is up can override per
  # invocation.
  automatable: false
  # Project-specific; callers may override per invocation.
  build_commands:
    - "cmake --build build"

ollama_fallback:
  endpoint: "http://localhost:11434"
  models:
    default: "qwen2.5-coder:14b-instruct-q6_K"

escalation_rules:
  # Claude (Tier 1) is deliberately last in the automated chain, after
  # Gemini (Tier 2) -- reserved as the strongest/last-resort automated
  # repair attempt before human handoff, not spent on problems Gemini
  # might still resolve. Tier 1's separate `tier_1_planner` role (initial
  # `triapi plan` authoring) is unaffected by this ordering.
  tier4_to_tier3:
    trigger: consecutive_build_failures
    threshold: 2
  tier3_to_tier2:
    trigger: deepseek_unresolved
    threshold: 1
    action: call_gemini_api
  tier2_to_tier1:
    trigger: gemini_unresolved
    threshold: 1
    action: call_claude_code
  tier1_to_human:
    trigger: claude_code_unresolved
    threshold: 1
    action: log_and_notify
critique:
  enabled: true
  applies_to_tiers: ["tier_3", "tier_1", "tier_2"]
  critic: "tier_1"
  score_threshold: 7
  max_revision_attempts: 1
self_fix:
  enabled: true

jules_tester:
  # Google Jules REST API, confirmed live 2026-08-16/17 against the real
  # API (public docs were wrong on one field, see below). Advisory-only
  # post-dispatch verification -- never a repair tier, never blocks.
  enabled: true
  source: "sources/github/DanielNg520/TriAPI"  # confirmed-live REST source name (GET /sources), NOT "owner/repo" form
  daily_task_limit: 100  # Google AI Pro tier (confirmed by user 2026-08-19: this account has AI Pro,
  # billing-enabled Cloud project with a $10/mo recurring credit + $300 intro credit): Jules in Pro is
  # 100 tasks/24h on Gemini 3 Pro, not the 15/24h Free tier this was previously set to. Ultra would be 300/24h.
  poll_timeout_s: 900   # 15 min; live discovery sessions took several minutes incl. plan-approval delay
  poll_interval_s: 15
  # CORRECTED FIELD PATH (2026-08-17, live verification): POST /sessions body
  # uses sourceContext.githubRepoContext.startingBranch. Public docs claim
  # sourceContext.githubBranch -- confirmed WRONG via live 400: "Unknown name\n  # \"githubBranch\" at 'session.source_context': Cannot find field."
