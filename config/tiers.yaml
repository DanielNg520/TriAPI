# Single source of truth for the 4-tier pipeline. Scripts read this instead
# of hardcoding model names, endpoints, or escalation thresholds.

tier_1_planner:
  # Primary planner: local `agy` CLI (Gemini 3.1 Pro via Antigravity),
  # same working provider/model/effort tier_3_debugger already uses --
  # reused deliberately, not moved out of tier_3 (see tier_3_debugger below).
  # On any failure, planner.py falls back to tier_1_manager's Claude CLI
  # (Sonnet 5, high effort) instead of erroring out -- there is no separate
  # fallback block here by design, it always falls back to tier_1_manager's
  # config.
  # 2026-08-26: swapped from "stealth/ox-alpha" -- that stealth slug rotated
  # out of OpenRouter's catalog (confirmed via GET /api/v1/models, 404 on
  # probe), which hard-blocked the whole pipeline at the probe_models()
  # pre-flight stage.
  # 2026-08-28: swapped from "nvidia/nemotron-3-ultra-550b-a55b:free" --
  # confirmed live, repeatedly, producing hallucinated planning output:
  # fully fabricated tool-call transcripts inventing nonexistent code/files
  # (a fictional Dispatcher class, a fake carryover file with made-up queue
  # items), truncated mid-sentence responses auto-approved as complete
  # plans, and degenerate self-repeating non-plans with zero real content --
  # roughly half of one session's planning calls were unusable. Replaced
  # with "dots-studio/dots-3-note-preview:free" -- which ALSO, confirmed
  # live the same day, hallucinated fake `<dots_function_call>`/`<invoke>`
  # tool-call markup despite tier_1_planner's non-'cli' path having no
  # tools wired in at all (planner.py's own docstring: non-'cli' providers
  # "lack tools"). Two free OpenRouter models in a row fabricated tool use
  # that was never offered to them -- moved off free OpenRouter models
  # entirely for this tier, onto the same real, working, tool-using `agy`
  # CLI path tier_3_debugger already relies on. `dots-3-note-preview:free`
  # demoted to tier_3_debugger as a secondary model (see below), not
  # dropped from the approved-models list entirely.
  provider: agy
  models:
    default: gemini-3.1-pro
  default_model: default
  effort: high
  role: "strategic planning"
  automatable: true
  outputs: ["PLAN.md", "ARCHITECTURE.md"]

tier_1_manager:
  enabled: true
  provider: "cli"
  models:
    default: "claude-sonnet-5"
  default_model: "default"
  # Reasoning effort passed to `claude -p --effort <level>`. Valid CLI values:
  # low, medium, high, xhigh, max.
  effort: "high"

tier_2_manager:
  # 2026-09-01: off-peak/peak now swap PROVIDER (via peak_alt, resolved by
  # budget_guard.resolve_peak_conditional), not skip-the-tier like before --
  # off-peak stays DeepSeek v4 Pro (cheap window), peak switches to agy/
  # Gemini 3.7 Flash instead of DeepSeek's 2x-billed window. peak_hours_utc
  # stays here (not on tier_3_debugger, which now also has provider:
  # deepseek) because budget_guard.resolve_deepseek_tier() scans
  # TIER_SCAN_ORDER and returns the FIRST tier with provider==deepseek --
  # that's this block -- so this is the one whose peak_hours_utc actually
  # gets read.
  provider: deepseek
  api_key_secret: deepseek_api_key
  name: "DeepSeek API"
  endpoint: "https://api.deepseek.com"
  models:
    default: "deepseek-v4-pro"
  default_model: default
  role: "task orchestration, context isolation, high-level architectural correction"
  automatable: true
  peak_hours_utc:
    - ["01:00", "04:00"]
    - ["06:00", "10:00"]
  pricing:
    last_verified: "2026-08-09"
    cache_hit_per_mtok_usd: 0.003625
    cache_miss_per_mtok_usd: null
    output_per_mtok_usd: null
  peak_alt:
    provider: agy
    models:
      default: gemini-3.7-flash
    default_model: default
    effort: high



# Shared OpenRouter connection defaults for any tier/fallback leg that
# dispatches through the "openrouter" provider. Previously borrowed from
# tier_1_planner's own endpoint field, back when tier_1_planner itself used
# OpenRouter -- broken 2026-08-28 when tier_1_planner moved to the `agy`
# provider and dropped its endpoint/api_key_secret fields (see
# tier_1_planner's history comment). Pulled out into its own stable block,
# same pattern as gemini_fallback/deepseek_reference_pricing above, so it
# survives any future tier reassignment. Used today by
# tier_5_librarian's fallback_openrouter leg (librarian_escalate.py).
openrouter_defaults:
  endpoint: "https://openrouter.ai/api/v1"
  api_key_secret: open_router_api_key

# Fixed reference point for cost_report.deepseek_flash_cost() -- prices
# Tier 4's actual volume as if it had run on DeepSeek flash instead,
# regardless of which tier slot (if any) DeepSeek currently occupies.
# Deliberately NOT nested under any tier_N_* block: those blocks describe
# the live, hot-swappable pipeline assignment (see tier_2_manager/
# tier_3_debugger's own swap history above), while this is a stable
# external benchmark that must survive tier reassignment. Moved out of
# tier_3_debugger's old pricing.flash sub-block 2026-08-25 when that tier
# swapped to agy and stopped carrying any DeepSeek pricing at all.
deepseek_reference_pricing:
  last_verified: "2026-08-09"
  cache_miss_per_mtok_usd: 0.14
  cache_hit_per_mtok_usd: 0.0028
  output_per_mtok_usd: null

tier_3_debugger:
  # 2026-09-01: moved off agy/Gemini 3.1 Pro (see tier_1_planner's own
  # history comment -- gemini-3.1-pro now lives there instead) onto
  # DeepSeek v4 Flash off-peak, with a peak_alt swap to OpenRouter's free
  # Nemotron model during DeepSeek's peak-billing window (see
  # budget_guard.resolve_peak_conditional). Previously this tier was
  # skipped outright during peak hours; it now stays live year-round, just
  # on a different backend when DeepSeek is expensive.
  provider: deepseek
  api_key_secret: deepseek_api_key
  endpoint: "https://api.deepseek.com"
  models:
    default: "deepseek-v4-flash"
  default_model: default
  effort: high
  role: "complex C++ logic, hard SIMD fixes, algorithmic diffs"
  automatable: true
  peak_alt:
    provider: openrouter
    endpoint: "https://openrouter.ai/api/v1"
    api_key_secret: open_router_api_key
    models:
      default: "nvidia/nemotron-3.5-lightning:free"
    default_model: default

tier_4_worker:
  # 2026-09-01: inverted relative to tiers 2/3 -- Tier 4 is the
  # highest-VOLUME tier, so it defaults to the free OpenRouter Nemotron
  # model off-peak (when cloud calls are "cheap", reusing DeepSeek's
  # window purely as a shared clock -- Tier 4 itself never calls
  # DeepSeek) and falls back to the local Ollama model during DeepSeek's
  # peak window, when leaning on local/free-forever compute is safer than
  # hammering a shared free-tier cloud endpoint at its busiest time. See
  # budget_guard.resolve_peak_conditional.
  provider: openrouter
  endpoint: "https://openrouter.ai/api/v1"
  api_key_secret: open_router_api_key
  models:
    default: "nvidia/nemotron-3.5-lightning:free"
  default_model: default
  role: "high-volume code drafting, cmake/g++ compilation loops"
  automatable: true
  # Project-specific; callers may override per invocation.
  build_commands:
    - "cmake --build build"
  peak_alt:
    provider: ollama
    endpoint: "http://localhost:11434"
    models:
      default: "qwen2.5-coder:14b-instruct-q6_K"
    default_model: default

tier_5_librarian:
  enabled: true
  role: doc_librarian
  automatable: true
  provider: agy
  effort: high
  models:
    primary: "gemini-3.7-flash"
  target_globs: ["*.md", "docs/**"]
  verify_command: null
  max_attempts: 2



escalation_rules:
  # Claude (Tier 1) is deliberately last in the automated chain, after
  # Gemini (Tier 2) -- reserved as the strongest/last-resort automated
  # repair attempt before human handoff, not spent on problems Gemini
  # might still resolve. Tier 1's separate `tier_1_planner` role (initial
  # `triapi plan` authoring) is unaffected by this ordering.
  tier4_to_tier3:
    trigger: consecutive_build_failures
    threshold: 2
  tier3_to_tier2:
    trigger: deepseek_unresolved
    threshold: 1
    action: call_gemini_api
  tier2_to_tier1:
    trigger: gemini_unresolved
    threshold: 1
    action: call_claude_code
  tier1_to_human:
    trigger: claude_code_unresolved
    threshold: 1
    action: log_and_notify

critique:
  enabled: true
  applies_to_tiers: ["tier_3", "tier_1", "tier_2", "tier_4"]
  critic: "tier_1"
  score_threshold: 7
  max_revision_attempts: 1
self_fix:
  enabled: true

jules_tester:
  # Google Jules REST API, confirmed live 2026-08-16/17 against the real
  # API (public docs were wrong on one field, see below). Advisory-only
  # post-dispatch verification -- never a repair tier, never blocks.
  # Runs on Gemini 3 Pro under the hood, but user confirmed 2026-08-25
  # this is fine to leave on: Jules usage is metered against its own
  # separate daily task cap (see daily_task_limit below), not the
  # billing-enabled Google Cloud project that caused the tier_2_manager
  # fallback_chain incident (see CARRYOVER.md) -- different exposure, so
  # the standing "no Gemini calls" rule doesn't reach this one.
  enabled: true
  source: "sources/github/DanielNg520/TriAPI"  # confirmed-live REST source name (GET /sources), NOT "owner/repo" form
  daily_task_limit: 100  # Google AI Pro tier (confirmed by user 2026-08-19: this account has AI Pro,
  # billing-enabled Cloud project with a $10/mo recurring credit + $300 intro credit): Jules in Pro is
  # 100 tasks/24h on Gemini 3 Pro, not the 15/24h Free tier this was previously set to. Ultra would be 300/24h.
  poll_timeout_s: 900   # 15 min; live discovery sessions took several minutes incl. plan-approval delay
  poll_interval_s: 15
  # CORRECTED FIELD PATH (2026-08-17, live verification): POST /sessions body
  # uses sourceContext.githubRepoContext.startingBranch. Public docs claim
  # sourceContext.githubBranch -- confirmed WRONG via live 400: "Unknown name\n  # \"githubBranch\" at 'session.source_context': Cannot find field."
